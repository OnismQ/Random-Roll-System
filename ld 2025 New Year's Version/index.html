<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Dog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ff9a9e;
            color: #FFD700;
            text-align: center;
            padding: px 0;
            z-index: 1000;
            /* 确保它始终位于其他内容之上 */
        }

        .footer a {
            color: #FFD700;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffd700;
            text-shadow: 2px 2px 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 310px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            animation: fadeIn 2s;
        }

        .name-display {
            font-size: 60px;
            font-weight: bold;
            margin: 20px 0;
            animation: flash 0.5s infinite;
        }

        @keyframes flash {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            color: whitesmoke;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
    <style>
        /* 设置按钮样式 */
        .settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #d55d6a;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .settings-btn:hover {
            background-color: #b9444e;
            transform: scale(1.1);
        }


        /* 模态窗口的背景 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 模态窗口内容 */
        .modal-content {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        /* 关闭按钮 */
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            margin-right: -10px;
        }

        .close:hover,
        .close:focus {
            color: #333;
            cursor: pointer;
        }

        /* 文本框 */

        #nameInput {
            width: 80%;
            padding: 10px;
            background-color: #b9444e;
            margin-top: 5px;
            font-size: 16px;
            color: #ffffff;
            /* 字体颜色改为白色 */
            border: 1px solid #ffffff;
            border-radius: 10px;
            resize: none;
            font-weight: bold;
            /* 加粗字体 */
            box-shadow: inset 0 5px 3px rgba(0, 0, 0, 0.1);
        }

        /* 保存按钮 */
        .save-btn {
            background-color: #d55d6a;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        .save-btn:hover {
            background-color: #b9444e;
            transform: scale(1.1);
        }

        /* 让整个页面的字体更清晰 */
        body {
            font-family: 'Arial', sans-serif;
            font-size: 16px;
        }
    </style>

    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #d55d6a;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            transition: transform 0.5s ease;
        }

        .close:hover,
        .close:focus {
            color: #d55d6a;
            text-decoration: none;
            cursor: pointer;
            transform: rotate(360deg);
        }
    </style>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                /* 开始时完全透明 */
            }

            to {
                opacity: 1;
                /* 结束时完全不透明 */
            }
        }

        .fade-in {
            animation: fadeIn 2s ease-in-out;
        }
    </style>
    <style>
        /* 调整选择名单下拉框的样式 */
        .modal-content select {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #b9444e;
            border-radius: 5px;
            background-color: #b9444e;
            color: white;
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.1);
            appearance: none;
            /* 隐藏默认下拉箭头 */
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .modal-content select:hover {
            border-color: #468cee;
            transform: scale(1.01);
        }

        /* 添加名单按钮样式 */
        .modal-content button#addListConfigBtn {
            background: #d55d6a;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            transition: background 0.3s ease;
        }

        .modal-content button#addListConfigBtn:hover {
            background: #b9444e;
        }
    </style>
    <style>
        #deleteListConfigBtn {
            background-color: #f73131;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            transition: background-color 0.3s ease;
        }

        #deleteListConfigBtn:hover {
            background-color: rgba(255, 0, 0, 0.7);
        }
    </style>
    <style>
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            /* 确保 canvas 不遮挡其他内容 */
        }
    </style>
    <style>
        .light {
            position: absolute;
            border-radius: 50%;
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: blink 1.5s infinite alternate;
        }
    
        @keyframes blink {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
    
</head>

<body>
    <div class="container">
        <h1>Lucky Dog</h1>
        <div class="name-display" id="nameDisplay">Start</div>
        <button class="btn" id="startBtn">Start Random(It can stop randomly)</button>
        <button class="btn" id="pauseBtn" disabled>Pause(You Don't Need To Stop)</button>
    </div>

    <button id="settingsBtn" class="settings-btn">Settings</button>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>选择和管理名单</h2>
            <div>
                <label for="listSelector">选择名单:</label>
                <select id="listSelector">
                    <option value="default">默认名单</option>
                </select>
                <button id="addListConfigBtn">添加新名单</button>
                <button id="deleteListConfigBtn" class="#deleteListConfigBtn">删除名单</button>

            </div>

            <textarea id="nameInput" rows="10" cols="30" placeholder="输入名单，每行一个名字"></textarea>
            <br>
            <button id="saveBtn" class="save-btn">保存(Save)</button>
        </div>
    </div>

    <div class="footer">
        <p>Copyright©2024 <a title="博客" href="https://blog.pixelcrafters.com.cn/" target="_blank"
                rel="noopener">PixelCrafters</a> By <a title="个人博客" href="https://pixelcrafters.cn/" target="_blank"
                rel="noopener">Onism</a> </p>
    </div>

    <script src="1.js"></script>
    <script src="nameread.js"></script>
    <canvas id="fireworksCanvas"></canvas>
    <script src="effects.js"></script>
</body>

</html>
